name: Release Please

# Every push to main updates the release pull request. Merging that pull request makes a draft
# release with the tag vX.Y.Z (release-please-config.json); this workflow then builds the MSI from
# the tag, attaches it and publishes the release. Steps for the owner: docs/RELEASING.md.
on:
  push:
    branches: [main]

# Each job asks for what it needs: only release-please and the final upload can write.
permissions: {}

# One run at a time, never cancelled: a release being built is finished before the next push's
# run starts.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds with a read-only token and no build cache (a release is built clean). The shared script
  # checks the version against the app package before anything is downloaded or built, so a tag
  # that does not match app/Cargo.toml fails here and the draft stays a draft with no MSI.
  build-msi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # Same pin as ci.yml (a commit of the action's stable branch); update both together.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check the tag, then build and check the MSI
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if ($env:TAG -match '^v(\d+\.\d+\.\d+)$') { $version = $Matches[1] } else { throw "Tag '$env:TAG' is not vX.Y.Z" }
          ./.github/scripts/build-msi.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msi
          path: ${{ env.MSI_PATH }}
          if-no-files-found: error
          retention-days: 1

  # The release is a draft until here: it is published only with its MSI attached. A re-run
  # replaces the asset (--clobber), and publishing a published release changes nothing.
  publish-msi:
    needs: [release-please, build-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msi
          path: msi
      - name: Attach the MSI and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected="msi/volatus-${TAG#v}-x86_64.msi"
          files=(msi/*.msi)
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$expected" ]; then
            echo "expected only $expected, found: ${files[*]:-no MSI}" >&2
            exit 1
          fi
          gh release upload "$TAG" "$expected" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Attached $expected to $TAG and published it"
