name: CI

# A PR branch runs once, through pull_request; push runs only for main (after a merge).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # Only main saves the cache: every branch can restore main's, and PR branches neither pay
      # for the upload nor push main's cache out of the repository's 10 GB limit.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests marked #[ignore] need Administrator rights on a real NTFS volume, or a release
      # timing run; they are not run here.
      - name: Test
        run: cargo test --workspace --no-fail-fast
