[package]
name = "app"
version = "0.3.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "volatus"
path = "src/main.rs"

[dependencies]
scan = { path = "../scan" }
treemap = { path = "../treemap" }
flow = { path = "../flow" }
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
window-vibrancy = "0.8"
rfd = "0.17"
# Copy Path (context menu). Already in the lock through Slint's winit backend: no new package.
arboard = { version = "3.7", default-features = false }
# The window's HWND for the shell menu (`shell::window_hwnd`) and the owner of the Recycle Bin's
# shell windows. Already in the lock through Slint.
raw-window-handle = "0.6"
serde_json = "1.0.154"
# The fast permanent delete removes files in parallel (already in the lock through `scan`).
rayon = "1"

[build-dependencies]
# Pinned like i-slint-backend-testing: `with_debug_info` (build.rs) is not a stable API.
slint-build = "=1.18.1"
embed-resource = "3"

# Elevation: IsUserAnAdmin and ShellExecuteW "runas". Same crate and version as `scan`, so no new code in the build.
# The fast delete (purge.rs) opens each item relative to its folder's handle with NtCreateFile:
# Wdk_Foundation (OBJECT_ATTRIBUTES), Wdk_Storage_FileSystem (NtCreateFile), Win32_System_IO
# (IO_STATUS_BLOCK) and Win32_Security (OBJECT_ATTRIBUTES's fields; also gates CreateFileW).
# The right-click menu's Delete reads the Shift key (Win32_UI_Input_KeyboardAndMouse: GetKeyState).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_WindowsProgramming", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The shell context menu (`shell`): IContextMenu and IShellFolder exist only in `windows`, not in
# `windows-sys`. 0.62.2 is the copy Slint already builds: `cargo tree -p app -i windows -e normal`
# fails if a second version comes in. Win32_System_Registry: SHELLEXECUTEINFOW (ShellExecuteExW).
# The Recycle Bin delete (recycle.rs) is IFileOperation with a progress sink, a COM object that
# windows-sys cannot implement. Win32_UI_Shell: IFileOperation, IFileOperationProgressSink,
# IShellItem, SHCreateItemFromParsingName, the FOF/FOFX/TSF flags. Win32_System_Com: CoInitializeEx,
# CoCreateInstance (and gates SHCreateItemFromParsingName). Win32_Foundation: HWND, E_ABORT, RPC_E_CHANGED_MODE.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# windows-core: the `implement` macro's generated code names `::windows_core` directly.
windows-core = "0.62.2"

# tests/wix.rs and the menu round trip in cli.rs read the installer source (already in the lock through Slint).
# tests/release.rs reads the release-please files and app/Cargo.toml (both crates already in the lock).
[dev-dependencies]
roxmltree = "0.21.1"
toml = "1.1.8"
# Headless window tests of the delete dialog (delete_ui.rs): Slint's testing backend, the same
# version as slint and already in the lock through it. `renderer-software` draws a snapshot.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

# The installer: `cargo wix -p app` (WiX Toolset v3) builds wix/main.wxs into
# target/wix/volatus-<version>-x86_64.msi (.github/scripts/build-msi.ps1 does every step).
# ICE43 and ICE57 assume a per-user install (a Start menu shortcut in a component keyed by a file
# in Program Files); this one is per-machine (ALLUSERS=1), where the Start menu folder is the
# machine's. Re-check both suppressions whenever main.wxs's components change: they hide every
# ICE43/ICE57 finding, not only these ones. ICE69 is not suppressed (tests/wix.rs
# ice69_is_not_suppressed): the Explorer menu names the exe as [INSTALLFOLDER]volatus.exe.
[package.metadata.wix]
name = "volatus"
linker-args = ["-sice:ICE43", "-sice:ICE57"]
