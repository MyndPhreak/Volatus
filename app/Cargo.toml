[package]
name = "app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "volatus"
path = "src/main.rs"

[dependencies]
scan = { path = "../scan" }
treemap = { path = "../treemap" }
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
window-vibrancy = "0.8"
rfd = "0.17"
# Copy Path (context menu). Already in the lock through Slint's winit backend: no new package.
arboard = { version = "3.7", default-features = false }
# The window's HWND for the shell menu (`shell::window_hwnd`). Already in the lock through Slint.
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18.1"
embed-resource = "3"

# Elevation: IsUserAnAdmin and ShellExecuteW "runas". Same crate and version as `scan`, so no new code in the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The shell context menu (`shell`): IContextMenu and IShellFolder exist only in `windows`, not in
# `windows-sys`. 0.62.2 is the copy Slint already builds: `cargo tree -p app -i windows -e normal`
# fails if a second version comes in. Win32_System_Registry: SHELLEXECUTEINFOW (ShellExecuteExW).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# tests/wix.rs and the menu round trip in cli.rs read the installer source (already in the lock through Slint).
# tests/release.rs reads the release-please files and app/Cargo.toml (both crates already in the lock).
[dev-dependencies]
roxmltree = "0.21.1"
serde_json = "1.0.154"
toml = "1.1.8"

# The installer: `cargo wix -p app` (WiX Toolset v3) builds wix/main.wxs into
# target/wix/volatus-<version>-x86_64.msi (.github/scripts/build-msi.ps1 does every step).
# ICE43 and ICE57 assume a per-user install (a Start menu shortcut in a component keyed by a file
# in Program Files); this one is per-machine (ALLUSERS=1), where the Start menu folder is the
# machine's. Re-check both suppressions whenever main.wxs's components change: they hide every
# ICE43/ICE57 finding, not only these ones. ICE69 is not suppressed (tests/wix.rs
# ice69_is_not_suppressed): the Explorer menu names the exe as [INSTALLFOLDER]volatus.exe.
[package.metadata.wix]
name = "volatus"
linker-args = ["-sice:ICE43", "-sice:ICE57"]
