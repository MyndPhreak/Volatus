[package]
name = "app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "volatus"
path = "src/main.rs"

[dependencies]
scan = { path = "../scan" }
treemap = { path = "../treemap" }
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
window-vibrancy = "0.8"
rfd = "0.15"

[build-dependencies]
slint-build = "1.18.1"
embed-resource = "3"

# Elevation: IsUserAnAdmin and ShellExecuteW "runas". Same crate and version as `scan`, so no new code in the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
