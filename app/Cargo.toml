[package]
name = "app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "volatus"
path = "src/main.rs"

[dependencies]
scan = { path = "../scan" }
treemap = { path = "../treemap" }
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
window-vibrancy = "0.8"
rfd = "0.15"

[build-dependencies]
slint-build = "1.18.1"
embed-resource = "3"

# Elevation: IsUserAnAdmin and ShellExecuteW "runas". Same crate and version as `scan`, so no new code in the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# tests/wix.rs and the menu round trip in cli.rs read the installer source (already in the lock through Slint).
[dev-dependencies]
roxmltree = "0.21.1"

# The installer: `cargo wix -p app` (WiX Toolset v3) builds wix/main.wxs into
# target/wix/volatus-<version>-x86_64.msi (.github/scripts/build-msi.ps1 does every step).
# ICE43 and ICE57 assume a per-user install (a Start menu shortcut in a component keyed by a file
# in Program Files); this one is per-machine (ALLUSERS=1), where the Start menu folder is the
# machine's. ICE69 refuses the Explorer menu's [#VolatusExe] because the menu components are in
# the ExplorerMenu feature and the exe in Main; ExplorerMenu is a child of Main, which can't be left
# out, so the exe is always installed with the menu (tests/wix.rs
# the_menu_feature_is_always_installed_with_the_exe). Re-check all three suppressions whenever
# main.wxs's components change: they hide every ICE43/ICE57/ICE69 finding, not only these ones.
[package.metadata.wix]
name = "volatus"
linker-args = ["-sice:ICE43", "-sice:ICE57", "-sice:ICE69"]
