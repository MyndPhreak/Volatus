[package]
name = "scan"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_IO", "Win32_System_Ioctl"] }

# The benchmark (docs/BENCHMARK.md). `test = true`: its smoke test runs with `cargo test`.
[[example]]
name = "bench"
test = true
